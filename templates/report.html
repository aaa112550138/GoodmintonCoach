<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ report_title or '羽球分析報告' }}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* 基礎設定 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 2rem 0; /* 上下留白 */
        }
        
        .container {
            max-width: 900px; 
            margin: 0 auto;
            background: #ffffff;
            padding: 2.5rem 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #003366;
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 1rem;
            font-weight: 800;
        }

        h2 { 
            color: #1d3557; 
            margin-top: 2.5rem;
            margin-bottom: 1.5rem; 
            font-weight: 700;
            border-left: 5px solid #007bff;
            padding-left: 15px;
        }

        /* 摘要區塊優化 */
        .introduction-text {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #333;
            background-color: #f8f9fa;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            margin-bottom: 2.5rem;
        }

        /* 圖表網格 */
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr; /* 單欄設計 */
            gap: 2.5rem; 
        }

        .chart-card {
            border: 1px solid #eee;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            overflow: hidden; 
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .chart-card:hover {
            transform: translateY(-5px); 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .chart-card img {
            width: 100%; 
            height: auto; 
            display: block;
            background-color: #f8f9fa; 
            border-bottom: 1px solid #eee;
        }
        .card-content { padding: 1.5rem; }
        .chart-card h3 {
            font-size: 1.25rem;
            color: #007bff;
            margin-top: 0;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        
        /* Markdown 樣式修正 */
        .markdown-text h1, .markdown-text h2, .markdown-text h3 { color: #1a237e; margin-top: 1rem; font-size: 1.1em; }
        .markdown-text ul, .markdown-text ol { padding-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-text li { margin-bottom: 0.5rem; color: #555; }
        .markdown-text strong { color: #d63384; font-weight: 700; }
        .markdown-text p { margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="/" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> 返回儀表板</a>
            <button class="btn btn-outline-dark btn-sm" onclick="window.print()"><i class="fas fa-print"></i> 列印</button>
        </div>

        <h1>{{ report_title or '羽球分析報告' }}</h1>
        
        <h2 style="text-align: center; border: none; padding: 0;">📊 分析摘要</h2>
        <div class="introduction-text markdown-text" id="main-summary">
            {{ main_introduction_text }}
        </div>

        <h2>📈 詳細圖表分析</h2>
        <div class="chart-grid">
            {% for item in chart_data_list %}
            <div class="chart-card">
                <img src="{{ item.image_url }}" alt="{{ item.title }}">
                <div class="card-content">
                    <h3><i class="fas fa-chart-bar"></i> {{ item.title }}</h3>
                    <div class="card-description markdown-text">
                        {{ item.description }}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div> 

        <hr class="my-5">

        {% if original_prompt %}
        <div class="alert alert-warning d-flex justify-content-between align-items-center shadow-sm rounded-3">
            <div>
                <i class="fas fa-lightbulb fa-lg me-2 text-warning"></i> 
                <strong>覺得這個分析指令很棒？</strong> <span class="d-none d-md-inline">您可以將其存為「最愛模版」，下次直接一鍵呼叫！</span>
            </div>
            <button class="btn btn-dark" onclick="openSaveModal()">
                <i class="fas fa-save"></i> 存為模版
            </button>
        </div>
        {% endif %}
    </div>

    <div class="modal fade" id="saveTemplateModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title"><i class="fas fa-save"></i> 儲存為分析模版</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">模版名稱</label>
                        <input type="text" id="templateName" class="form-control" placeholder="例如：殺球效益深度分析">
                    </div>
                    <input type="hidden" id="templatePrompt" value="{{ original_prompt }}">
                    
                    <div class="bg-light p-3 rounded border">
                        <small class="text-muted d-block mb-1">將儲存的指令內容：</small>
                        <code class="text-dark" style="white-space: pre-wrap;">{{ original_prompt }}</code>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveTemplate()">確認儲存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 解析 Markdown 內容
            const summaryEl = document.getElementById('main-summary');
            if (summaryEl && typeof marked !== 'undefined') {
                summaryEl.innerHTML = marked.parse(summaryEl.textContent);
            }

            const descriptions = document.querySelectorAll('.card-description');
            descriptions.forEach(el => {
                if(typeof marked !== 'undefined') {
                    el.innerHTML = marked.parse(el.textContent);
                }
            });
        });

        // 開啟 Modal
        function openSaveModal() {
            // 需要 Bootstrap JS 支援
            var myModal = new bootstrap.Modal(document.getElementById('saveTemplateModal'));
            myModal.show();
        }

        // 執行儲存
        function saveTemplate() {
            const name = document.getElementById('templateName').value.trim();
            const prompt = document.getElementById('templatePrompt').value;
            
            if(!name) { alert('請輸入模版名稱！'); return; }

            // 呼叫後端 API
            fetch('/api/save-template', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name, prompt: prompt})
            })
            .then(r => r.json())
            .then(data => {
                if(data.success) {
                    alert('✨ 儲存成功！');
                    window.location.href = '/'; // 成功後回首頁
                } else {
                    alert('失敗: ' + data.message);
                }
            })
            .catch(err => {
                console.error(err);
                alert('系統錯誤，請稍後再試');
            });
        }
    </script>
</body>
</html>
