<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽球選手報告</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>🏸 羽球教練儀表板</h1>

        <!-- PART 1: 舊版單選 (保持不變) -->
        <form id="analysis-form">
             <!-- ...保留原本內容... -->
             <div class="filters-container">
                <div class="form-group full-width">
                    <label>搜尋選手 (可選)</label>
                    <input type="text" id="search_input" name="search_query" placeholder="請輸入學生姓名..." value="">
                </div>
            </div>
            <div class="filters-container">
                <div class="form-group">
                    <label>場次</label>
                    <select id="session_select" name="session_id">
                        <option value="" selected disabled>-- 請選擇場次 --</option>
                        {% for s in sessions %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>屬性</label>
                    <select id="attribute_select" name="attribute_name">
                        <option value="" selected disabled>-- 請選擇屬性 --</option>
                        {% for attr in attributes %}<option value="{{ attr }}">{{ attr }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-group full-width">
                <button type="submit" id="generate-button">生成圖表 (舊版)</button>
            </div>
        </form>
        <div id="analysis-result-area"><p>舊版結果區...</p></div>

        <hr class="section-divider">

        <!-- ========================================== -->
        <!-- PART 2: 【修改】AI 多選分析 -> 跳轉新頁面   -->
        <!-- ========================================== -->
        <section class="llm-section">
            <h2>🤖 AI 綜合戰術分析</h2>
            <p class="desc-text">請選擇多個技術維度，點擊按鈕後將在<b>新分頁</b>生成完整報告。</p>
            
            <!-- 
                關鍵修改：
                1. 使用 <form> 包裹
                2. action="/ai-report" 指向新路由
                3. target="_blank" 在新分頁開啟
            -->
            <form action="/ai-report" method="POST" target="_blank" id="ai-report-form">
                
                <div class="filters-container">
                    <div class="form-group full-width">
                        <label>選擇分析維度 (可多選)</label>
                        
                        <!-- 下拉選單 UI (HTML 結構不變，但在 checkbox 加入 name) -->
                        <div class="custom-dropdown" id="llm-multi-select">
                            <div class="select-trigger">
                                <span class="trigger-text">請選擇分析項目...</span>
                                <span class="arrow">▼</span>
                            </div>
                            <div class="custom-options">
                                <!-- 
                                    關鍵：加上 name="selected_items" 
                                    這樣表單送出時，後端可以用 request.form.getlist('selected_items') 抓到
                                -->
                                <label class="option-item"><input type="checkbox" name="selected_items" value="不同擊球位置"> 不同擊球位置</label>
                                <label class="option-item"><input type="checkbox" name="selected_items" value="球種"> 球種</label>
                                <label class="option-item"><input type="checkbox" name="selected_items" value="球落點分布"> 球落點分布</label>
                                <label class="option-item"><input type="checkbox" name="selected_items" value="多拍來回耐力"> 多拍來回耐力</label>
                                <label class="option-item"><input type="checkbox" name="selected_items" value="防守反擊策略"> 防守反擊策略</label>
                                <label class="option-item"><input type="checkbox" name="selected_items" value="心理素質評估"> 心理素質評估</label>
                                <label class="option-item"><input type="checkbox" name="selected_items" value="體力"> 體力</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group full-width">
                    <!-- 改為 submit 按鈕 -->
                    <button type="submit" class="btn-ai">✨ 在新分頁生成 AI 報告</button>
                </div>
            </form>
            
            <!-- 原本的結果顯示區塊可以刪除了，因為現在會直接跳轉 -->
        </section>

        <hr class="section-divider">

        <!-- PART 3: 比賽報告連結 (不變) -->
        <h2>📄 比賽報告列表</h2>
        <div class="filters-container">
            <div class="form-group full-width">
                <label>選擇比賽</label>
                <select id="match_link_select" onchange="updateReportLinks()">
                    <option value="" selected disabled>-- 請選擇比賽連結 --</option>
                    {% for link in links %}
                    <option value="{{ url_for(link.route, report_id=link.param) }}">{{ link.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="filters-container" style="width:100%; margin-top:10px;">
                <div class="form-group">
                    <label>前往報告</label>
                    <a id="report-btn" href="#" class="btn-disabled" target="_blank">請先選擇比賽</a>
                </div>
                
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
