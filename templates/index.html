<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽球選手報告</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>🏸 羽球教練儀表板</h1>

        <!-- ========================================== -->
        <!-- PART 1: 舊版單選 (保持不變)                -->
        <!-- ========================================== -->
        <form id="analysis-form">
            <div class="filters-container">
                <div class="form-group full-width">
                    <label>搜尋選手 (可選)</label>
                    <input type="text" id="search_input" name="search_query" placeholder="請輸入學生姓名..." value="">
                </div>
            </div>
            <div class="filters-container">
                <div class="form-group">
                    <label>場次</label>
                    <select id="session_select" name="session_id">
                        <option value="" selected disabled>-- 請選擇場次 --</option>
                        {% for s in sessions %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>屬性</label>
                    <select id="attribute_select" name="attribute_name">
                        <option value="" selected disabled>-- 請選擇屬性 --</option>
                        {% for attr in attributes %}<option value="{{ attr }}">{{ attr }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-group full-width">
                <button type="submit" id="generate-button">生成圖表 (舊版)</button>
            </div>
        </form>
        <div id="analysis-result-area"><p>舊版結果區...</p></div>

        <hr class="section-divider">

        <!-- ========================================== -->
        <!-- PART 2: AI 多選分析 (跳轉新頁面)            -->
        <!-- ========================================== -->
        <section class="llm-section">
            <h2>🤖 AI 綜合戰術分析 (多選)</h2>
            <p class="desc-text">請選擇多個技術維度，AI 將為您生成綜合文字報告與戰術示意圖。</p>
            
            <form action="/ai-report" method="POST" target="_blank" id="ai-report-form">
                <div class="filters-container">
                    <div class="form-group full-width">
                        <label>選擇分析維度</label>
                        <div class="custom-dropdown" id="llm-multi-select">
                            <div class="select-trigger">
                                <span class="trigger-text">請選擇分析項目...</span>
                                <span class="arrow">▼</span>
                            </div>
                            <div class="custom-options">
                                <!-- 這裡是之前那堆選項，為了版面乾淨我省略一點 -->
                                <label class="option-item"><input type="checkbox" name="selected_items" value="殺球威力分析"> 殺球威力分析</label>
                                <label class="option-item"><input type="checkbox" name="selected_items" value="防守非受迫性失誤"> 防守非受迫性失誤</label>
                                <label class="option-item"><input type="checkbox" name="selected_items" value="守轉攻成功率"> 守轉攻成功率</label>
                                <label class="option-item"><input type="checkbox" name="selected_items" value="關鍵分防守心態"> 關鍵分防守心態</label>
                                <!-- ...你可以把剩下的補回來... -->
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group full-width">
                    <button type="submit" class="btn-ai">✨ 生成多選報告</button>
                </div>
            </form>
        </section>

        <hr class="section-divider">

        <!-- ========================================== -->
        <!-- PART 3: 【新功能】教練自定義輸入分析        -->
        <!-- ========================================== -->
        <section class="llm-section">
            <h2>💬 教練自定義指令</h2>
            <p class="desc-text">直接輸入您想問 AI 的戰術問題或分析指令，例如：「幫我分析這場比賽的網前失誤原因」。</p>
            
            <form action="/ai-report-text" method="POST" target="_blank">
                <div class="filters-container">
                    <div class="form-group full-width">
                        <label for="user_input">輸入指令</label>
                        <!-- 使用 textarea 讓輸入框大一點 -->
                        <textarea id="user_input" name="user_input" rows="3" placeholder="請在此輸入您的問題..."></textarea>
                    </div>
                </div>
                <div class="form-group full-width">
                    <button type="submit" class="btn-ai" style="background: linear-gradient(135deg, #FF8008 0%, #FFC837 100%);">🚀 發送指令生成報告</button>
                </div>
            </form>
        </section>

        <hr class="section-divider">

        <!-- ========================================== -->
        <!-- PART 4: 比賽報告列表 (原功能)               -->
        <!-- ========================================== -->
        <h2>📄 比賽報告列表</h2>
        <div class="filters-container">
            <div class="form-group full-width">
                <label>選擇比賽</label>
                <select id="match_link_select" onchange="updateReportLinks()">
                    <option value="" selected disabled>-- 請選擇比賽連結 --</option>
                    {% for link in links %}
                        <option value="{{ url_for(link.route, report_id=link.param) }}">{{ link.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="filters-container" style="width:100%; margin-top:10px;">
                <div class="form-group">
                    <label>前往報告</label>
                    <a id="report-btn" href="#" class="btn-disabled" target="_blank">請先選擇比賽</a>
                </div>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-warning text-dark">
                <i class="fas fa-star"></i> 我的最愛模版 (Saved Templates)
            </div>
            <div class="card-body">
                {% if my_templates %}
                    <div class="list-group">
                        {% for t in my_templates %}
                        <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                            <form action="/ai-report-text" method="POST" class="flex-grow-1" style="margin:0;">
                                <input type="hidden" name="user_input" value="{{ t.prompt }}">
                                <button type="submit" class="btn btn-link text-decoration-none text-dark text-start p-0 w-100">
                                    <strong>{{ t.name }}</strong>
                                    <div class="small text-muted text-truncate" style="max-width: 300px;">
                                        {{ t.prompt }}
                                    </div>
                                </button>
                            </form>
                            
                            <button class="btn btn-sm btn-outline-danger ms-2" onclick="deleteTemplate('{{ t.id }}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        {% endfor %}
                    </div>
                {% else %}
                    <p class="text-muted text-center p-3">
                        尚無儲存的模版。<br>
                        <small>請在生成報告後點選「存為最愛」。</small>
                    </p>
                {% endif %}
            </div>
        </div>

        <script>
        function deleteTemplate(id) {
            if(!confirm('確定要刪除這個模版嗎？')) return;
            fetch('/api/delete-template/' + id, {method: 'POST'})
            .then(r => r.json())
            .then(data => {
                if(data.success) location.reload();
                else alert(data.message);
            });
        }
        </script>
    </div>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
